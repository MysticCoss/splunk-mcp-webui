[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-mcp-webui"
version = "1.1.0"
description = "MCP server for Splunk that connects through the Splunk Web UI - no admin token, no app install needed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MysticCoss" }]
keywords = ["splunk", "mcp", "model-context-protocol", "spl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0,<3",
    "requests>=2.31.0",
]

[project.scripts]
splunk-mcp-webui = "splunk_mcp_webui.server:main"

[project.urls]
Homepage = "https://github.com/MysticCoss/splunk-mcp-webui"

[tool.setuptools]
packages = ["splunk_mcp_webui"]
